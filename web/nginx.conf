# Same layout as the Vite dev server: the app at /, the FastAPI app under /api/.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:8000/;
    # /chat streams Server-Sent Events: don't buffer, or replies arrive all at once.
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_http_version 1.1;
  }

  location / {
    try_files $uri /index.html;
  }
}
