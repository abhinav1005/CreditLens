[project]
name = "creditlens"
version = "0.1.0"
description = "Credit-education assistant wrapped in an evaluation, guardrail, and model-comparison system. Synthetic data only."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.60",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "black>=24.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant", "src/guardrails", "src/storage", "src/credit", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["live: calls a real model API (skipped without an API key)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff.lint.per-file-ignores]
# Data-heavy authoring script: long case strings read better unwrapped.
"scripts/draft_golden_v1.py" = ["E501"]
